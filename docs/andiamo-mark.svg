<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-labelledby="title">
  <!-- The archway A from public/andiamo-mark.svg, with the brand colour baked in so it shows in the README.
       An <img> can't inherit currentColor, so the light and dark brand values are copied from src/app/andiamo.css. -->
  <title id="title">Andiamo</title>
  <style>
    .mark { color: #0d5c47; }
    @media (prefers-color-scheme: dark) { .mark { color: #5fd0a8; } }
  </style>
  <g class="mark">
    <path d="M7 41 20.5 9.5Q24 1.5 27.5 9.5L41 41H34L24 16 14 41Z" fill="currentColor"/>
    <path d="M10 33C18 23 29 36 39 25" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
