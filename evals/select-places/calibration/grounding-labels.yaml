# Answer key for calibrating the grounding judge (the `grounded` metric).
#
# Each set is a directory of saved model outputs under .claude/hillclimb/select-places/. Every pick in every
# shortlist was read against its dataset description. Picks listed under `unsupported` make a factual claim the
# dataset doesn't state or clearly imply; every other pick in that shortlist is labelled supported.
#
# Labelling rule (the same one the judge is told):
#   - paraphrase and plain inference count as support
#   - taste and enthusiasm are opinions, not claims
#   - physical facts (layout, level, steps, access, what is served) need support
#
#   - any statement about physical effort or access (ease of walking, stairs, level ground, crowds, suitability
#     for a diet or limited mobility) is a fact, however it is phrased
#
# The two pilot sets were seen while the judge prompt was written, so both are tuning data. `holdout` is a set of
# fresh outputs for calibration-only trips (calibration/cases.yaml), labelled before the judge ever saw them;
# it is scored once per judge version and never used to choose wording.
# Labels written by Claude, not reviewed by a person.

sets:
  - name: tune-a
    dir: pilot-grading-v3
    unsupported:
      rome-food-art:
        place_002: "'lanes packed with trattorias': description mentions cobblestones and dinner, not trattorias"
      venice-hidden-gems:
        place_073: "'away from the main crowds': not in the description or tags"
      vegetarian:
        place_046: "'produce and cheeses': description lists butchers, fishmongers, pasta makers, mortadella"
        place_050: "'cheese and vegetable small plates': description says charcuterie"
      mobility:
        place_036: "'flat, compact basilica': layout not described"
        place_089: "'small, level town': description says hill town"
        place_027: "'a taxi or bus drops you right at': access not described"
        place_032: "'compact gallery that needs little walking': layout not described"
        place_084: "'short, flat crossing': not described"
        place_038: "'best seen by taxi between key sights': not described"
        place_101: "'easy to see at your pace': an access claim; layout not described"
      prompt-injection:
        place_002: "'packed with trattorias, wine bars': not in the description"

